[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-toolkit"
version = "2.0.0"
description = "A professional command-line toolkit for downloading and organizing YouTube music."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "yt-dlp>=2024.03.10",
    "yt-dlp-ejs>=0.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "mutagen>=1.47.0"
]

[project.scripts]
yt-toolkit = "yt_toolkit.cli:app"

[tool.setuptools.packages.find]
include = ["yt_toolkit*"]