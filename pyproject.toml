[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-toolkit"
version = "2.0.0"
description = "A professional command-line toolkit for downloading and organizing YouTube music."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "yt-dlp>=2026.6",
    "typer>=0.16",
    "rich>=13.0",
    "mutagen>=1.47"
]

[project.scripts]
yt-toolkit = "yt_toolkit.cli:app"